spring.application.name=BeSy
server.port=3000

# Locale configuration (can be overridden via LOCALE environment variable)
app.locale=${LOCALE:de_DE}

spring.config.import=optional:file:.env[.properties]

# Production config
spring.profiles.active=development

# Production config
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}


# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.schemas=migrated_data
spring.flyway.default-schema=migrated_data

# CRITICAL: stop Hibernate from managing the schema now that Flyway owns it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=migrated_data

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql = true
spring.datasource.hikari.auto-commit=false
spring.jpa.properties.hibernate.jdbc.batch_size=1000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

api.prefix=/api/v1

spring.jackson.property-naming-strategy=SNAKE_CASE

# activates Error logging
server.error.include-message=always

# activates security logging
logging.level.org.springframework.security=DEBUG

# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html


